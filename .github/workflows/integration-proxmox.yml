name: Integration Test (Proxmox)

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "Имя ВМ для тестового развёртывания"
        required: true
        default: "test-vm-ci"

jobs:
  deploy-test:
    runs-on: self-hosted  # Раннер в сети с доступом к Proxmox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install community.proxmox

      - name: Run deploy for a test VM
        env:
          PROXMOX_API_HOST: ${{ secrets.PROXMOX_API_HOST }}
          PROXMOX_API_USER: ${{ secrets.PROXMOX_API_USER }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: |
          # Подставляем секреты в переменные Ansible через extra-vars
          ansible-playbook playbooks/deploy_vms.yml \
            -e "proxmox_api_host=$PROXMOX_API_HOST" \
            -e "proxmox_api_user=$PROXMOX_API_USER" \
            -e "proxmox_token_id=$PROXMOX_TOKEN_ID" \
            -e "proxmox_token_secret=$PROXMOX_TOKEN_SECRET" \
            --limit localhost