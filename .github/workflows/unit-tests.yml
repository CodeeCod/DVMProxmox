name: Unit Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify test discovery
        run: |
          echo "=== Repo tree (tests) ==="
          ls -la tests || echo "tests/ directory NOT FOUND"
          echo "=== pytest collection ==="
          pytest tests/ --collect-only -q || true

      - name: Run unit tests
        run: pytest tests/ -v