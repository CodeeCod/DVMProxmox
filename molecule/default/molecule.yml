dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    pre_build_image: true
    # Важно: для работы Ansible внутри контейнера могут потребоваться привилегии
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    command: "/lib/systemd/systemd"
    capabilities:
      - SYS_ADMIN
provisioner:
  name: ansible
  # Переопределяем переменные, чтобы роль не пыталась подключиться к реальному Proxmox
  inventory:
    group_vars:
      all:
        # Используем фейковые данные. Роль упадет на этапе вызова API, 
        # но мы проверим, что она дошла до этого этапа.
        proxmox_api_host: "127.0.0.1"
        proxmox_api_user: "test@pam"
        proxmox_token_id: "test"
        proxmox_token_secret: "test"
  playbook: converge.yml
verifier:
  name: ansible